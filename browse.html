<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animations — Geedo</title>
<meta name="description" content="Every animation on the Geedo Hub, playing the same files the robots download.">
<link rel="stylesheet" href="assets/geedo.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
  .bar .field{width:auto;flex:1;min-width:180px;max-width:280px}
  .h1 .count{color:var(--dim);font-weight:500}
  .grid{display:grid;gap:clamp(22px,2.6vw,32px) clamp(14px,2vw,24px);grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  figure.anim{margin:0;cursor:pointer}
  figure.anim .screen{border-color:#000;border-radius:12px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  figure.anim .screen canvas{width:100%!important}
  figure.anim:hover .screen{transform:translateY(-3px);box-shadow:0 18px 30px -18px rgba(0,0,0,.5)}
  figure.anim h3{margin-top:12px;font-size:15px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #d-meta{margin-top:6px;font-size:13.5px;color:var(--mute)}
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  dialog{border:0;padding:0;background:0;max-width:none;max-height:none}
  dialog::backdrop{background:rgba(4,5,7,.86);backdrop-filter:blur(8px)}
  .sheet{background:var(--bg);border:var(--pen);border-radius:var(--wobble-box);box-shadow:var(--pencil-lift);
         padding:clamp(20px,3vw,32px);width:min(560px,92vw)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="logo" href="index.html"><img class="mark" src="assets/logo.png" alt="">GEEDO</a>
    <div class="grow"></div>
    <div class="nav-links row">
      <a class="link" href="browse.html">Animations</a>
      <a class="link" href="packs.html">Packs</a>
      <a class="link" href="studio/index.html">Studio</a>
      <a class="link" href="settings.html">My Geedo</a>
      <a class="link" href="unlock.html">Redeem</a>
    </div>
    <a class="btn primary buy" href="buy.html">Buy</a>
    <button class="nav-toggle" aria-label="Menu">≡</button>
  </div>
</nav>

<main class="wrap" style="padding-block:clamp(36px,5vw,64px)">

  <h1 class="h1" style="margin-bottom:clamp(22px,3vw,34px)">Animations <span class="count" id="n-anims"></span></h1>

  <div class="bar" id="filters">
    <input class="field" id="q" type="search" placeholder="Search…" autocomplete="off">
  </div>

  <div class="grid" id="grid"><div class="empty">Loading the Hub…</div></div>
  <div class="empty" id="none" hidden>Nothing matches that.</div>

</main>

<dialog id="dlg">
  <div class="sheet stack" style="--s:16px">
    <div class="spread" style="align-items:flex-start">
      <div>
        <h2 class="h2" id="d-name">—</h2>
        <p id="d-meta">—</p>
      </div>
      <button class="btn plain" id="d-close" aria-label="Close" style="font-size:20px;line-height:1">×</button>
    </div>
    <div id="d-screen"></div>
    <div class="row">
      <a class="btn primary" id="d-dl" download>Download .bin</a>
      <a class="btn" id="d-raw" target="_blank" rel="noopener">View raw</a>
    </div>
  </div>
</dialog>

<footer>
  <div class="wrap foot">
    <a class="logo" href="index.html"><span class="led"></span>GEEDO</a>
    <nav class="foot-links" aria-label="Site">
      <a href="buy.html">Buy</a>

      <a href="packs.html">Packs</a>
      <a href="makers.html">Makers</a>
      <a href="studio/index.html">Studio</a>
      <a href="settings.html">My Geedo</a>
      <a href="unlock.html">Redeem</a>
      <a href="GUIDE.md">Guide</a>
      <a href="https://discord.gg/Tp6urXEMQd" target="_blank" rel="noopener">Discord</a>
      <a href="https://github.com/Breadboardy/Geedo-Hub" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</footer>

<script src="assets/geedo.js"></script>
<script>
(async () => {
  const { Screen, loadBin, manifest, pretty } = window.Geedo;
  const grid = document.getElementById('grid');
  const none = document.getElementById('none');

  let anims = [];
  try { anims = (await manifest()).animations || []; }
  catch (e) { grid.innerHTML = '<div class="empty">Could not reach the Hub.</div>'; return; }

  document.getElementById('n-anims').textContent = anims.length;

  // Category buttons come from the data, so a new category on the Hub turns up
  // here without anyone editing this file.
  const cats = [...new Set(anims.map(a => a.category).filter(Boolean))].sort();
  const bar = document.getElementById('filters');
  let active = 'all';
  const mkChip = (val, label) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.cat = val;
    b.setAttribute('aria-pressed', val === 'all');
    b.onclick = () => {
      active = val;
      bar.querySelectorAll('button.chip').forEach(x =>
        x.setAttribute('aria-pressed', x.dataset.cat === val));
      apply();
    };
    return b;
  };
  bar.prepend(...[mkChip('all', 'All'), ...cats.map(c => mkChip(c, pretty(c)))]);

  // Build every card up front, then show/hide. Rebuilding on each keystroke
  // would throw away decoded frames and re-fetch, which is both slower and
  // visibly restarts every animation mid-loop.
  grid.replaceChildren();
  const cards = [];

  for (const a of anims) {
    const fig = document.createElement('figure');
    fig.className = 'anim';
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    const holder = document.createElement('div');
    holder.className = 'screen';
    holder.style.aspectRatio = '2/1';
    const cap = document.createElement('figcaption');
    cap.innerHTML = `<h3></h3>`;
    cap.querySelector('h3').textContent = pretty(a.name);
    fig.append(holder, cap);
    grid.append(fig);

    const card = { el: fig, data: a, hay: `${a.name} ${a.id} ${a.category || ''} ${a.author || ''}`.toLowerCase() };
    cards.push(card);

    loadBin(a.file).then(anim => {
      const s = new Screen(anim, { scale: 2 });
      s.el.style.width = '100%';
      fig.replaceChild(s.el, holder);
      card.anim = anim;
      const open = () => show(a, anim);
      fig.onclick = open;
      fig.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    }).catch(() => {
      fig.style.opacity = '.45';
    });
  }

  const q = document.getElementById('q');
  function apply(){
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    for (const c of cards) {
      const ok = (active === 'all' || c.data.category === active) &&
                 (!term || c.hay.includes(term));
      c.el.hidden = !ok;
      if (ok) shown++;
    }
    none.hidden = shown > 0;
  }
  q.addEventListener('input', apply);

  const dlg = document.getElementById('dlg');
  let big = null;
  function show(a, anim){
    document.getElementById('d-name').textContent = pretty(a.name);
    document.getElementById('d-meta').textContent =
      `${pretty(a.category) || 'Animation'} · ${anim.frames.length} frames · ${anim.fps} fps` +
      `${anim.loop ? ' · loops' : ''}${anim.pingpong ? ' · ping-pong' : ''} · ${(a.size/1024).toFixed(1)} KB`;
    const dl = document.getElementById('d-dl');
    dl.href = 'animations/' + a.file;
    dl.download = a.id + '.bin';
    document.getElementById('d-raw').href = 'animations/' + a.file;
    if (big) big.destroy();
    big = new Screen(anim, { scale: 4 });
    big.el.style.width = '100%';
    document.getElementById('d-screen').replaceChildren(big.el);
    dlg.showModal();
  }
  document.getElementById('d-close').onclick = () => dlg.close();
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { if (big) { big.destroy(); big = null; } });
})();
</script>
</body>
</html>
