<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maker — Geedo</title>
<meta name="description" content="One maker on the Geedo Hub and everything they drew for him.">
<link rel="stylesheet" href="assets/geedo.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  .who{display:flex;gap:22px;align-items:center;padding:28px 0 6px;flex-wrap:wrap}
  .who .sub{color:var(--blue-soft);margin:6px 0 0;font-size:17px}
  .crumbs{color:var(--blue-soft);font-weight:700;font-size:14px;padding-top:22px}
  .crumbs a:hover{color:#fff;text-decoration:underline}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="logo" href="index.html"><img class="mark" src="assets/logo.png" alt="">GEEDO</a>
    <div class="grow"></div>
    <div class="nav-links row">
      <a class="link" href="browse.html">Animations</a>
      <a class="link" href="packs.html">Packs</a>
      <a class="link" href="studio/index.html">Studio</a>
      <a class="link" href="settings.html">My Geedo</a>
      <a class="link" href="unlock.html">Redeem</a>
    </div>
    <a class="btn primary buy" href="buy.html">Buy</a>
    <button class="nav-toggle" aria-label="Menu">≡</button>
  </div>
</nav>

<main class="wrap" style="padding-bottom:clamp(48px,6vw,88px)">
  <p class="crumbs"><a href="makers.html">Makers</a> <span id="crumb"></span></p>
  <header class="who">
    <span class="avatar xl" id="avatar">?</span>
    <div>
      <h1 class="h1" id="name">…</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>

  <section class="panel" id="work">
    <div class="feed" id="feed"><div class="empty"><span class="spin"></span> Loading the Hub…</div></div>
  </section>

  <div id="missing" class="panel" hidden>
    <h2 class="h2">Nobody by that name yet.</h2>
    <div class="row" style="margin-top:20px"><a class="btn primary" href="makers.html">Everyone who has drawn</a><a class="btn" href="make.html">Draw him something</a></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="logo" href="index.html"><span class="led"></span>GEEDO</a>
    <nav class="foot-links" aria-label="Site">
      <a href="buy.html">Buy</a>
      <a href="browse.html">Animations</a>
      <a href="packs.html">Packs</a>
      <a href="makers.html">Makers</a>
      <a href="studio/index.html">Studio</a>
      <a href="settings.html">My Geedo</a>
      <a href="unlock.html">Redeem</a>
      <a href="GUIDE.md">Guide</a>
      <a href="https://discord.gg/Tp6urXEMQd" target="_blank" rel="noopener">Discord</a>
      <a href="https://github.com/Breadboardy/Geedo-Hub" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</footer>

<script src="assets/geedo.js"></script>
<script>
(async () => {
  const G = window.Geedo;
  const $ = id => document.getElementById(id);
  const name = (G.param('name') || '').trim();
  let all;
  try { all = await G.all(); }
  catch (e) { $('name').textContent = 'Could not reach the Hub.'; return; }

  // The system screens (booting, updating, failing) are his, not a maker's
  // drawings, so they are left off here as on the makers list.
  const mine = all.anims.filter(a => a.by === name && !G.isSystem(a));
  if (!name || !mine.length) {
    $('work').hidden = true;
    $('name').textContent = name || 'Who?';
    $('crumb').textContent = '';
    $('missing').hidden = false;
    return;
  }
  document.title = `${name} — Geedo`;
  $('avatar').textContent = G.initial(name);
  $('name').textContent = name;
  $('crumb').textContent = '› ' + name;
  const packs = new Set(mine.filter(a => a.pack).map(a => a.pack));
  if (name === G.OFFICIAL) $('name').insertAdjacentHTML('beforeend', ' <span class="tag blue" style="font-size:14px;vertical-align:middle;position:relative;top:-8px">official</span>');
  $('sub').textContent = `${mine.length} animation${mine.length === 1 ? '' : 's'}`
    + (packs.size ? ` · ${packs.size} pack${packs.size === 1 ? '' : 's'}` : '');
  $('feed').replaceChildren(...G.newest(mine).map(a => G.card(a)));
})();
</script>
</body>
</html>
